services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      # Public origin users open in the browser (comma separated for several).
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      TRUST_PROXY: "true"
    volumes:
      - datachat-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  datachat-data:
