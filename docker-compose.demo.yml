# One-click local demo sandbox with a preloaded read-only PostgreSQL e-commerce database.
# For local evaluation only — do NOT use these default secrets in production.
#
# Quick start:
#   docker compose -f docker-compose.demo.yml up -d --build
#   docker compose -f docker-compose.demo.yml exec server node apps/server/dist/cli/seed-demo.js
#   Open http://localhost:5173 (admin / datachat-demo)

services:
  demo-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo_postgres_password
    volumes:
      - ./evals/nl2sql/fixtures/postgres.sql:/docker-entrypoint-initdb.d/01-fixture.sql:ro
      - ./deploy/demo/02-readonly-role.sql:/docker-entrypoint-initdb.d/02-readonly-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo_shop"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  server:
    image: ${IMAGE_PREFIX:-}datachat-server:${DATACHAT_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
    depends_on:
      demo-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      APP_SECRET: ${APP_SECRET:-demo-only-secret-change-in-production-0123456789abcdef}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-datachat-demo}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      TRUST_PROXY: "true"
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      DEMO_PG_HOST: demo-postgres
      DEMO_PG_PORT: "5432"
      DEMO_PG_DATABASE: demo_shop
      DEMO_PG_USER: datachat_ro
      DEMO_PG_PASSWORD: datachat_ro_demo
    volumes:
      - datachat-demo-data:/data
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-}datachat-web:${DATACHAT_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  datachat-demo-data:
